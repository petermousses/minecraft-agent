map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /ui/;
    }

    location = /viewer {
        return 308 /viewer/;
    }

    location ^~ /viewer/ {
        proxy_pass http://${RUNTIME_HOST}:3077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location ^~ /ui/ {
        try_files $uri $uri/ /ui/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /api/status {
        proxy_pass http://${RUNTIME_HOST}:3078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /recording {
        proxy_pass http://${RUNTIME_HOST}:3078;
        proxy_http_version 1.1;
    }

    location ^~ /recording/ {
        proxy_pass http://${RUNTIME_HOST}:3078;
        proxy_http_version 1.1;
    }

    location ~ ^/runs/([A-Za-z0-9._-]+)/native-live/([^/]+\.(m3u8|ts))$ {
        alias /var/www/runs/$1/native-live/$2;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        access_log off;
    }

    location ~ ^/runs/([A-Za-z0-9._-]+)/full-playthrough\.mp4(\.finished\.json)?$ {
        alias /var/www/runs/$1/full-playthrough.mp4$2;
        types {
            video/mp4 mp4;
            application/json json;
        }
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location / {
        return 404;
    }
}
