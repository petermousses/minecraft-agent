apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minecraft-agent
  labels:
    app.kubernetes.io/name: minecraft-agent
    app.kubernetes.io/part-of: minecraft-agent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Games
    gethomepage.dev/name: Minecraft Agent
    gethomepage.dev/icon: mdi-minecraft
    gethomepage.dev/description: Autonomous Minecraft agent and live viewer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - minecraft-agent.omv.mousses.xyz
      secretName: minecraft-agent-tls
  rules:
    - host: minecraft-agent.omv.mousses.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minecraft-agent
                port:
                  name: http
